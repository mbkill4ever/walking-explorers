<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 320" role="img" aria-labelledby="we-lockup-title">
  <title id="we-lockup-title">Walking Explorers</title>
  <!-- Lockup: skyline above, wordmark centered below.
       Default light variant: navy ink on cream.
       Add class="we-dark" to root <svg> for the cream-on-navy variant. -->
  <style>
