    .we-light  { fill: #E0B341; }
    .we-ink    { fill: #0E1320; }
    .we-dot    { fill: #E0B341; }
    .we-dark .we-bg     { fill: #0E1B30; }
    .we-dark .we-far    { fill: #FAF7F2; opacity: 0.18; }
    .we-dark .we-near   { fill: #FAF7F2; }
    .we-dark .we-stroke { stroke: #FAF7F2; }
    .we-dark .we-ink    { fill: #FAF7F2; }
    .we-dark .we-light  { fill: #E0B341; }
    .we-dark .we-dot    { fill: #E0B341; }
    .we-word {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
      font-weight: 800;
      font-size: 44px;
      letter-spacing: -1.2px;
