<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#1F3864" />
  <meta name="color-scheme" content="light" />
  <title>Walking Explorers — Beta access</title>
  <meta name="description" content="Walking Explorers beta — enter your invite code to access AI-guided walking discovery in NYC." />
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="apple-touch-icon" href="/icons/icon-180.png" />
  <link rel="icon" href="/icons/icon-192.png" type="image/png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --navy: #1F3864;
      --navy-deep: #14264a;
      --gold: #C9A961;
      --gold-dark: #8a6f30;
      --cream: #FAF7F2;
      --ink: #1c1c1c;
      --muted: #5a5a5a;
      --error: #b3261e;
      --error-bg: #fdecea;
      --radius: 10px;
      --shadow: 0 6px 24px rgba(20, 38, 74, 0.08);
    }
    *, *::before, *::after { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      background: var(--cream);
      color: var(--ink);
      min-height: 100svh;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
    }
    .visually-hidden {
      position: absolute !important;
      width: 1px; height: 1px;
      padding: 0; margin: -1px;
      overflow: hidden; clip: rect(0,0,0,0);
      white-space: nowrap; border: 0;
    }
    .skip-link {
      position: absolute; top: -40px; left: 8px;
      background: var(--navy); color: var(--cream);
      padding: 8px 12px; border-radius: 6px;
      text-decoration: none; z-index: 100;
    }
    .skip-link:focus { top: 8px; }
    main {
      flex: 1;
      display: flex; align-items: center; justify-content: center;
      padding: 32px 20px;
    }
    .gate {
      width: 100%; max-width: 440px;
      background: #fff;
      border: 1px solid rgba(31, 56, 100, 0.08);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 32px 28px;
    }
    .brand {
      display: flex; align-items: center; gap: 10px;
      margin-bottom: 24px;
    }
    .brand-mark {
      width: 36px; height: 36px;
      display: inline-flex; align-items: center; justify-content: center;
      background: var(--navy); border-radius: 8px;
    }
    .brand-mark::after {
      content: ""; width: 8px; height: 8px; border-radius: 50%;
      background: var(--gold); display: block;
    }
    .brand-name {
      font-weight: 700; font-size: 16px; letter-spacing: 0.01em;
      color: var(--navy);
    }
    h1 {
      font-size: 28px; line-height: 1.2; margin: 0 0 8px;
      color: var(--navy-deep); font-weight: 700;
      letter-spacing: -0.01em;
    }
    .lede {
      color: var(--muted); margin: 0 0 24px;
      font-size: 15px;
    }
    .field { margin-bottom: 16px; }
    label.field-label {
      display: block; font-weight: 500; font-size: 14px;
      color: var(--ink); margin-bottom: 6px;
    }
    input[type="text"] {
      width: 100%;
      font: inherit;
      font-size: 16px;
      padding: 12px 14px;
      border: 1.5px solid #d8d4cc;
      border-radius: 8px;
      background: var(--cream);
      color: var(--ink);
      letter-spacing: 0.04em;
      transition: border-color 120ms ease, box-shadow 120ms ease;
    }
    input[type="text"]:focus {
      outline: none;
      border-color: var(--navy);
      box-shadow: 0 0 0 3px rgba(31, 56, 100, 0.15);
    }
    .input-meta {
      display: flex; justify-content: space-between;
      font-size: 12px; color: var(--muted);
      margin-top: 6px;
    }
    button.submit {
      width: 100%;
      font: inherit; font-weight: 600; font-size: 15px;
      padding: 13px 16px;
      border: 0; border-radius: 8px;
      background: var(--navy); color: #fff;
      cursor: pointer;
      transition: background 120ms ease, opacity 120ms ease, transform 80ms ease;
      display: inline-flex; align-items: center; justify-content: center; gap: 10px;
      min-height: 48px;
    }
    button.submit:hover:not(:disabled) { background: var(--navy-deep); }
    button.submit:active:not(:disabled) { transform: translateY(1px); }
    button.submit:disabled { opacity: 0.5; cursor: not-allowed; }
    button.submit:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }
    .spinner {
      width: 16px; height: 16px;
      border: 2px solid rgba(255,255,255,0.35);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 700ms linear infinite;
      display: none;
    }
    button.submit.is-loading .spinner { display: inline-block; }
    button.submit.is-loading .submit-label { opacity: 0.85; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .error-area { margin-top: 14px; min-height: 0; }
    .error-area:empty { display: none; }
    .error-msg {
      background: var(--error-bg);
      color: var(--error);
      border: 1px solid rgba(179, 38, 30, 0.25);
      border-radius: 8px;
      padding: 10px 12px;
      font-size: 14px;
    }
    .footer {
      text-align: center;
      padding: 20px;
      color: var(--muted);
      font-size: 13px;
    }
    .footer a { color: var(--navy); text-decoration: none; }
    .footer a:hover, .footer a:focus { text-decoration: underline; }
    .help {
      margin-top: 20px;
      padding-top: 18px;
      border-top: 1px solid #ece8df;
      font-size: 13px; color: var(--muted);
    }
    .help a { color: var(--navy); }
    @media (prefers-reduced-motion: reduce) {
      .spinner { animation: none; }
      button.submit { transition: none; }
    }
  </style>
</head>
<body>
  <a class="skip-link" href="#gate-form">Skip to invite form</a>
  <main>
    <section class="gate" aria-labelledby="gate-heading">
      <div class="brand" aria-hidden="true">
        <span class="brand-mark"></span>
        <span class="brand-name">Walking Explorers</span>
      </div>
      <h1 id="gate-heading"><span id="welcome-text">Welcome.</span></h1>
      <p class="lede">Enter your 22-character invite code to unlock the beta.</p>

      <form id="gate-form" novalidate autocomplete="off">
        <div class="field">
          <label class="field-label" for="invite-input">Invite code</label>
          <input
            id="invite-input"
            name="invite"
            type="text"
            inputmode="text"
            autocomplete="one-time-code"
            autocapitalize="characters"
            spellcheck="false"
            maxlength="22"
            minlength="22"
            required
            aria-describedby="invite-help invite-counter"
            placeholder="e.g. 95UMGZySwK5RvEKXa57x5w"
          />
          <div class="input-meta">
            <span id="invite-help">22 characters, case-sensitive</span>
            <span id="invite-counter" aria-live="off">0 / 22</span>
          </div>
        </div>
        <button type="submit" class="submit" id="submit-btn"
                aria-label="Submit invite code and continue to beta"
                disabled>
          <span class="spinner" aria-hidden="true"></span>
          <span class="submit-label">Continue</span>
        </button>
        <div class="error-area" id="error-area" role="status" aria-live="polite" aria-atomic="true"></div>
      </form>

      <div class="help">
        Don't have a code? Request one at
        <a href="mailto:hello@walkingexplorers.com?subject=Beta%20invite%20request">hello@walkingexplorers.com</a>.
      </div>
    </section>
  </main>
  <div class="footer">
    <a href="/privacy">Privacy</a> &nbsp;&middot;&nbsp;
    <a href="/terms">Terms</a> &nbsp;&middot;&nbsp;
    &copy; <span id="year"></span> Walking Explorers
  </div>

  <script>
    (function () {
      'use strict';
      var form = document.getElementById('gate-form');
      var input = document.getElementById('invite-input');
      var btn = document.getElementById('submit-btn');
      var counter = document.getElementById('invite-counter');
      var errorArea = document.getElementById('error-area');
      var welcome = document.getElementById('welcome-text');
      var yearEl = document.getElementById('year');
      yearEl.textContent = new Date().getFullYear();

      try {
        var hasReturnMarker =
          document.cookie.indexOf('we_seen=') !== -1 ||
          (window.localStorage && localStorage.getItem('we_seen') === '1');
        welcome.textContent = hasReturnMarker ? 'Welcome back.' : 'Welcome.';
      } catch (e) {
        welcome.textContent = 'Welcome.';
      }

      function setError(msg) {
        if (!msg) { errorArea.innerHTML = ''; return; }
        var div = document.createElement('div');
        div.className = 'error-msg';
        div.textContent = msg;
        errorArea.innerHTML = '';
        errorArea.appendChild(div);
      }

      var isSubmitting = false;

      function updateCounter() {
        var n = input.value.length;
        counter.textContent = n + ' / 22';
        btn.disabled = (n !== 22) || isSubmitting;
      }

      input.addEventListener('input', function () {
        if (errorArea.firstChild) setError('');
        updateCounter();
      });

      function setLoading(loading) {
        isSubmitting = loading;
        if (loading) {
          btn.classList.add('is-loading');
          btn.disabled = true;
          btn.setAttribute('aria-busy', 'true');
        } else {
          btn.classList.remove('is-loading');
          btn.removeAttribute('aria-busy');
          updateCounter();
        }
      }

      function messageForStatus(status) {
        if (status === 401) return 'That code is invalid or already used. Double-check and try again.';
        if (status === 403) return 'This code has been revoked. Contact hello@walkingexplorers.com.';
        if (status === 404) return 'No matching invite code found.';
        if (status === 409) return 'This code has already been claimed.';
        if (status === 410) return 'This invite has expired.';
        if (status === 429) return 'Too many attempts. Please wait a minute and try again.';
        if (status >= 500) return 'Something went wrong on our end. Please try again in a moment.';
        return 'Could not verify the code. Please try again.';
      }

      form.addEventListener('submit', function (ev) {
        ev.preventDefault();
        if (isSubmitting) return;
        var code = input.value.trim();
        if (code.length !== 22) {
          setError('Invite codes are 22 characters.');
          input.focus();
          return;
        }
        setError('');
        setLoading(true);

        var ctrl = (typeof AbortController !== 'undefined') ? new AbortController() : null;
        var timeoutId = setTimeout(function () { if (ctrl) ctrl.abort(); }, 15000);

        fetch('/api/auth/login', {
          method: 'POST',
          credentials: 'same-origin',
          headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
          body: JSON.stringify({ token: code }),
          signal: ctrl ? ctrl.signal : undefined
        }).then(function (res) {
          clearTimeout(timeoutId);
          if (res.ok) {
            try { localStorage.setItem('we_seen', '1'); } catch (e) {}
            window.location.assign('/beta/app');
            return;
          }
          setLoading(false);
          setError(messageForStatus(res.status));
          input.focus();
          input.select && input.select();
        }).catch(function (err) {
          clearTimeout(timeoutId);
          setLoading(false);
          if (err && err.name === 'AbortError') {
            setError('Request timed out. Check your connection and try again.');
          } else {
            setError('Network error. Check your connection and try again.');
          }
        });
      });

      updateCounter();
    })();
  </script>
</body>
</html>
