<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Walking Explorers — Tab Bar v2 (Test Harness)</title>
<link rel="stylesheet" href="/beta/app/v2-styles/motion.css" />
<link rel="stylesheet" href="tab-bar-v2.css" />
<style>
  /* Test-harness shell only — production page provides these tokens itself. */
  :root {
    --navy: #1F3864;
    --navy-2: #162B4A;
    --gold: #E0B341;
    --gold-dark: #B8862C;
    --gold-soft: #F2D67D;
    --cream: #FAF7F2;
    --ink: #0F172A;
    --mute: #6B7280;
    --line: rgba(15, 23, 42, 0.08);
    --love: #DC2626;
  }
  html, body { margin: 0; padding: 0; height: 100%; background: var(--cream); font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; color: var(--ink); }
  .harness-shell { max-width: 430px; margin: 0 auto; min-height: 100dvh; position: relative; display: flex; flex-direction: column; background: var(--cream); box-shadow: 0 0 0 1px var(--line); }
  .harness-body { flex: 1; padding: 24px 18px 120px; overflow-y: auto; }
  .harness-body h1 { font-size: 18px; margin: 4px 0 12px; letter-spacing: -0.01em; }
  .harness-body p { color: var(--mute); font-size: 13.5px; line-height: 1.55; margin: 0 0 14px; }
  .harness-body code { background: rgba(15,23,42,0.06); padding: 1px 5px; border-radius: 4px; font-size: 12.5px; }
  .harness-controls { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 16px; }
  .harness-controls button { font: inherit; font-size: 12.5px; padding: 8px 12px; border-radius: 8px; border: 1px solid var(--line); background: #fff; cursor: pointer; }
  .harness-controls button:hover { background: var(--cream); }
  .harness-log { margin-top: 14px; padding: 10px 12px; background: #fff; border-radius: 10px; border: 1px solid var(--line); font-size: 12.5px; color: var(--mute); min-height: 60px; font-family: ui-monospace, SFMono-Regular, monospace; }
</style>
</head>
<body>

<!-- =================================================================
     Inline SVG sprite — tab icon definitions.
     These symbols will be promoted into /beta/app/v2-styles/icons.svg
     by the icons.svg agent. Until then, tab-bar-v2.js falls back to
     these inline definitions so the module is self-contained.
     IDs match the spec: tab-explore, tab-around, tab-walk, tab-saved, tab-profile
     (each with both outline & filled variants).
     ================================================================= -->
<svg width="0" height="0" style="position:absolute;width:0;height:0" aria-hidden="true" focusable="false" id="tab-bar-v2-sprite">
  <defs>
    <!-- EXPLORE — compass diamond -->
    <symbol id="tab-explore" viewBox="0 0 24 24">
      <circle cx="12" cy="12" r="8.25" fill="none" stroke="currentColor" stroke-width="1.5"/>
      <path d="M15.5 8.5 11 11.2l-2.5 4.3 4.5-2.7 2.5-4.3z" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/>
      <circle cx="12" cy="12" r="0.9" fill="currentColor"/>
    </symbol>
    <symbol id="tab-explore-filled" viewBox="0 0 24 24">
      <circle cx="12" cy="12" r="8.5" fill="currentColor"/>
      <path d="M15.5 8.5 11 11.2l-2.5 4.3 4.5-2.7 2.5-4.3z" fill="#fff" stroke="#fff" stroke-width="1" stroke-linejoin="round"/>
    </symbol>

    <!-- AROUND — radar / map-pin with concentric pulse -->
    <symbol id="tab-around" viewBox="0 0 24 24">
      <circle cx="12" cy="12" r="3" fill="none" stroke="currentColor" stroke-width="1.5"/>
      <circle cx="12" cy="12" r="6.5" fill="none" stroke="currentColor" stroke-width="1.5" stroke-dasharray="1.2 2.4" opacity="0.7"/>
      <circle cx="12" cy="12" r="1.2" fill="currentColor"/>
    </symbol>
    <symbol id="tab-around-filled" viewBox="0 0 24 24">
      <circle cx="12" cy="12" r="6.5" fill="none" stroke="currentColor" stroke-width="1.5" stroke-dasharray="1.2 2.4" opacity="0.65"/>
      <circle cx="12" cy="12" r="3.4" fill="currentColor"/>
    </symbol>

    <!-- WALK — walking-person glyph (used for FAB) -->
    <symbol id="tab-walk" viewBox="0 0 24 24">
      <circle cx="13.5" cy="4.8" r="1.7" fill="none" stroke="currentColor" stroke-width="1.7"/>
      <path d="M13.4 7.6 10.7 13l2.2 2.2.7 5.3" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M12.9 15.2 8.7 20.5" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/>
      <path d="M11.4 10.5 14.7 12l1.6 3.4" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M10.7 13 7.6 11.6" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/>
    </symbol>
    <symbol id="tab-walk-filled" viewBox="0 0 24 24">
      <circle cx="13.5" cy="4.8" r="1.9" fill="currentColor"/>
      <path d="M13.4 7.6 10.7 13l2.2 2.2.7 5.3" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M12.9 15.2 8.7 20.5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
      <path d="M11.4 10.5 14.7 12l1.6 3.4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </symbol>

    <!-- SAVED — bookmark (outline + filled) -->
    <symbol id="tab-saved" viewBox="0 0 24 24">
      <path d="M6.5 3.5h11a1 1 0 0 1 1 1V20l-6.5-3.8L5.5 20V4.5a1 1 0 0 1 1-1Z" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/>
    </symbol>
    <symbol id="tab-saved-filled" viewBox="0 0 24 24">
      <path d="M6.5 3.5h11a1 1 0 0 1 1 1V20l-6.5-3.8L5.5 20V4.5a1 1 0 0 1 1-1Z" fill="currentColor" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/>
    </symbol>

    <!-- PROFILE — person avatar (outline + filled) -->
    <symbol id="tab-profile" viewBox="0 0 24 24">
      <circle cx="12" cy="8.5" r="3.5" fill="none" stroke="currentColor" stroke-width="1.5"/>
      <path d="M4.5 20.5c0-4.1 3.4-7 7.5-7s7.5 2.9 7.5 7" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
    </symbol>
    <symbol id="tab-profile-filled" viewBox="0 0 24 24">
      <circle cx="12" cy="8.5" r="3.7" fill="currentColor"/>
      <path d="M4.5 20.5c0-4.1 3.4-7 7.5-7s7.5 2.9 7.5 7" fill="currentColor" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </symbol>

    <!-- Profile sheet sub-item icons (offers, feedback, changelog, settings, signout) -->
    <symbol id="tab-ic-offers" viewBox="0 0 24 24">
      <path d="M13.2 3.5H5.5a2 2 0 0 0-2 2v7.7c0 .53.21 1.04.59 1.41l5.8 5.8a2 2 0 0 0 2.82 0l7.7-7.7a2 2 0 0 0 0-2.82l-5.8-5.8A2 2 0 0 0 13.2 3.5Z" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/>
      <circle cx="8.2" cy="8.2" r="1.4" fill="none" stroke="currentColor" stroke-width="1.5"/>
    </symbol>
    <symbol id="tab-ic-feedback" viewBox="0 0 24 24">
      <path d="M4 6.5A2.5 2.5 0 0 1 6.5 4h11A2.5 2.5 0 0 1 20 6.5v8a2.5 2.5 0 0 1-2.5 2.5H10l-4 3.5v-3.5h-1.5A2.5 2.5 0 0 1 4 14.5z" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/>
      <path d="M9 11.2l2 2 4-4.4" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </symbol>
    <symbol id="tab-ic-changelog" viewBox="0 0 24 24">
      <path d="M6.5 3.5h8.7L19 7.4v11.6a1.5 1.5 0 0 1-1.5 1.5h-11A1.5 1.5 0 0 1 5 19V5a1.5 1.5 0 0 1 1.5-1.5Z" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/>
      <path d="M14.8 3.7V7.8H19" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/>
      <path d="M8 12.2h6M8 15.4h4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
      <path d="M15.4 13.3l.55 1.15 1.15.55-1.15.55-.55 1.15-.55-1.15-1.15-.55 1.15-.55z" fill="currentColor"/>
    </symbol>
    <symbol id="tab-ic-settings" viewBox="0 0 24 24">
      <path d="M12 3.5v2.2M12 18.3v2.2M5.5 12H3.3M20.7 12h-2.2M7.4 7.4 5.9 5.9M18.1 18.1l-1.5-1.5M7.4 16.6l-1.5 1.5M18.1 5.9l-1.5 1.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
      <circle cx="12" cy="12" r="5" fill="none" stroke="currentColor" stroke-width="1.5"/>
      <circle cx="12" cy="12" r="1.6" fill="none" stroke="currentColor" stroke-width="1.5"/>
    </symbol>
    <symbol id="tab-ic-signout" viewBox="0 0 24 24">
      <path d="M14.5 4.5H6a1.5 1.5 0 0 0-1.5 1.5v12A1.5 1.5 0 0 0 6 19.5h8.5" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="m15 8 4 4-4 4" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M19 12H9" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
    </symbol>
    <symbol id="tab-ic-chevron" viewBox="0 0 24 24">
      <path d="M9.5 5.5 16 12l-6.5 6.5" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </symbol>
  </defs>
</svg>

<!-- =================================================================
     Test-harness shell — proves the module renders standalone.
     Production usage: import TabBar from './tab-bar-v2.js' and
     call TabBar.mount(yourContainer, { onTabChange, initialTab }).
     ================================================================= -->
<div class="harness-shell">
  <div class="harness-body">
    <h1>Tab Bar v2 — Test Harness</h1>
    <p>This page renders the v2 tab bar standalone. Tap a tab to log the change. Use the buttons below to simulate badges and active-walk state.</p>
    <p>API: <code>TabBar.mount(el, { onTabChange, initialTab })</code> · <code>setActive</code> · <code>setBadge(name, n)</code> · <code>destroy</code></p>
    <div class="harness-controls">
      <button data-act="badge-saved-3">Saved badge = 3</button>
      <button data-act="badge-saved-dot">Saved dot</button>
      <button data-act="badge-around-dot">Around dot</button>
      <button data-act="badge-clear">Clear badges</button>
      <button data-act="walk-start">Simulate active walk</button>
      <button data-act="walk-end">Clear active walk</button>
      <button data-act="set-profile">Activate Profile tab</button>
    </div>
    <div class="harness-log" id="log">(events will appear here)</div>
  </div>

  <!-- Mount point for the tab bar -->
  <div id="tab-bar-mount"></div>
</div>

<script type="module">
  import TabBar from './tab-bar-v2.js';
  const log = document.getElementById('log');
  const print = (msg) => {
    const ts = new Date().toLocaleTimeString();
    log.textContent = `[${ts}] ${msg}\n` + log.textContent.split('\n').slice(0, 6).join('\n');
  };
  TabBar.mount(document.getElementById('tab-bar-mount'), {
    initialTab: 'explore',
    onTabChange: (name, meta) => print(`tab change → ${name}${meta ? ' (' + JSON.stringify(meta) + ')' : ''}`)
  });
  document.querySelector('.harness-controls').addEventListener('click', (e) => {
    const act = e.target?.dataset?.act;
    if (!act) return;
    switch (act) {
      case 'badge-saved-3':   TabBar.setBadge('saved', 3); print('badge saved=3'); break;
      case 'badge-saved-dot': TabBar.setBadge('saved', 'dot'); print('badge saved=dot'); break;
      case 'badge-around-dot':TabBar.setBadge('around', 'dot'); print('badge around=dot'); break;
      case 'badge-clear':     ['explore','around','saved','profile'].forEach(t => TabBar.setBadge(t, 0)); print('badges cleared'); break;
      case 'walk-start':      localStorage.setItem('we_active_walk_id', 'demo-walk-1'); window.dispatchEvent(new Event('we:active-walk-changed')); print('active walk simulated'); break;
      case 'walk-end':        localStorage.removeItem('we_active_walk_id'); window.dispatchEvent(new Event('we:active-walk-changed')); print('active walk cleared'); break;
      case 'set-profile':     TabBar.setActive('profile'); print('forced tab profile'); break;
    }
  });
</script>
</body>
</html>
